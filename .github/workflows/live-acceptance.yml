name: Manual live acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bootstrap.py
      - run: docker compose up --build -d
      - name: Wait for initial Airflow publication, not just container liveness
        run: |
          ready=false
          for attempt in $(seq 1 150); do
            if curl -fsS --max-time 10 http://127.0.0.1:8000/readyz >/dev/null; then ready=true; break; fi
            sleep 6
          done
          [[ "$ready" == true ]]
      - run: python3 scripts/smoke.py
      - run: docker compose run --rm tools evaluate --dataset /work/eval/retrieval.jsonl --output /work/reports/retrieval-evaluation.json
      - run: docker compose run --rm tools run --output /work/reports/benchmark.json
      - name: Enforce warm CLI pipeline target on this runner
        run: |
          python3 - <<'PYCODE'
          import json
          report = json.load(open('reports/benchmark.json'))
          assert report['duration_seconds'] <= 300, report
          PYCODE
      - name: Real warm DAG timing (runner hardware is recorded, not assumed)
        run: python3 scripts/benchmark_airflow.py
      - if: always()
        run: docker compose logs --no-color --tail=200 > reports/live-stack.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: live-acceptance-evidence, path: reports/}
      - if: always()
        run: docker compose down --volumes --remove-orphans
