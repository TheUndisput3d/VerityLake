name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check src tests dags scripts
      - run: pytest --cov=veritylake --cov-report=xml --cov-report=term --junitxml=reports/ci-tests.xml
      - run: python scripts/check_static.py
      - run: node --check src/veritylake/ui/app.js
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ matrix.python }}
          path: |
            reports/ci-tests.xml
            coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit==2.9.0
      # These advisories currently have no ChromaDB fix release, and the Starlette
      # fixes require Starlette 1.x, which is incompatible with FastAPI's <1.0 constraint.
      - run: >-
          pip-audit -r requirements.txt --format json --output audit.json
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 detect --source /repo --config /repo/.gitleaks.toml --no-git --redact --exit-code 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dependency-audit, path: audit.json}

  service-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: docker/setup-buildx-action@v3
      - run: pip install -r requirements-dev.txt -e .
      - run: python scripts/bootstrap.py
      - run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d minio minio-init chroma postgres
      - run: docker compose wait minio-init
      - name: Exercise real Delta, MinIO conditional writes and Chroma
        run: |
          set -a
          source .env
          set +a
          RUN_SERVICE_TESTS=1 pytest tests/integration/test_service_stack.py -v
      - name: Build and validate actual Airflow DAG
        run: |
          docker compose build airflow-init
          docker compose run --rm --no-deps airflow-init
          docker compose run --rm --no-deps airflow-scheduler python /opt/veritylake/scripts/check_dag.py
      - name: Collect logs without configuration dumps
        if: failure()
        run: docker compose logs --no-color --tail=100 > service-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: service-diagnostics, path: service-logs.txt}
      - if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.11.4'}
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
